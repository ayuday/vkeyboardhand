<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>vkeyboardhand × Vue 3</title>
  <link rel="stylesheet" href="../dist/vkeyboardhand.css">
  <style>
    body { font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif; padding: 40px 16px; background: #f6f8fc; }
    .wrap { max-width: 780px; margin: 0 auto; }
    h2 { text-align: center; }
    #app { background: #fff; border: 1px solid #e5e9f2; border-radius: 16px; padding: 32px 24px 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Vue 3 中使用 vkeyboardhand</h2>
    <div id="app"></div>
  </div>

  <!-- 框架：Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- 组件：本地 dist（发布后可直接换 CDN 链接） -->
  <script src="../dist/vkeyboardhand.umd.js"></script>
  <script>
    const { createApp, ref, onMounted, onBeforeUnmount } = Vue;

    const app = createApp({
      setup() {
        const container = ref(null);
        let kb = null;

        onMounted(() => {
          kb = VKeyboardHand.create(container.value, {
            keyboard: '../svg/keyboard.svg',
            hand: '../svg/hand.svg',
            theme: 'bone'
          });
        });

        onBeforeUnmount(() => {
          if (kb) kb.destroy();
        });

        return { container };
      },
      template: `<div ref="container"></div>`
    });

    app.mount('#app');
  </script>
</body>
</html>
